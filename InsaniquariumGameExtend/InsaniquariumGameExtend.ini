; InsaniquariumGameExtend 配置文件
; 与本 DLL 放在同一目录（即 ModLoader.exe 同级目录）。
; 修改后下次启动游戏生效。

[Mod]

; ---- 签名校验 ----
; 是否禁用 .sig 签名校验（让被修改的 partner.xml 等能正常加载）
; 1 = 禁用（默认，推荐）；0 = 恢复原版（仍做签名校验）
DisableSigCheck = 1

; 禁用方式
; 1 = 分支补丁（改 sub_486DF0 的 jnz -> jmp，报错分支不可达）
; 2 = 函数替换（把 .sig 校验器整体换成永远返回成功）
SigCheckMethod = 1

; ---- 商店扩展：提供所有鱼 ----
; 是否把被隐藏的鱼也放到商店（分到 7..12 槽，双行显示），
; 同时保留“买 X 解锁 Y”的科技树进度。
; 1 = 启用（默认）；0 = 完全回退原版商店逻辑
StoreAllFish = 1
